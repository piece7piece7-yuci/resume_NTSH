<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課外活動</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        section {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .form-box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .activity-title {
            margin-top: 0;
            color: #2e7d32;
        }
        .activity-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 15px 0;
            display: block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        label {
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-group {
            margin-top: 15px;
        }
        input[type="submit"], input[type="button"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        input[type="button"] {
            background-color: #777;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        input[type="button"]:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <header>
        <h1>課外活動</h1>
    </header>
    <section>
        <!-- 新增：社團活動與苔球製作圖片區塊 -->
        <div class="form-box">
            <h2 class="activity-title">🌱 社團活動：苔球製作</h2>
            <p>透過手作苔球植物，學習綠化生活與生態養護體驗。</p>
            
            <!-- 如果是 Flask 專案，建議使用以下 url_for 寫法： -->
            <img src="{{ url_for('static', filename='images/苔球製作.jpg') }}" alt="苔球製作" class="activity-img" onerror="this.onerror=null; this.src='/static/images/苔球製作.jpg';">
        </div>

        <!-- 原有的問題查詢表單區塊 -->
        <div class="form-box">
            <form action="/activities" method="post">
                <label for="question">你的問題:</label><br>
                <input type="text" id="question" name="question" value="{{ question }}"><br><br>
                <label for="answer">答案:</label><br>
                <input type="text" id="answer" name="answer" readonly value="{{ answer }}"><br><br>
                
                <div class="btn-group">
                    <input type="submit" value="送出">
                    <input type="button" value="回首頁" onclick="window.location.href='/'">
                </div>
            </form>
        </div>
    </section>
</body>
</html>
